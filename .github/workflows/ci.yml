name: Docker Compose CI

on:
  push:
    branches:
      - devops-setup
  pull_request:
    branches:
      - devops-setup

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Check Compose configuration
        run: docker compose -f docker-compose.yaml config -q

      - name: Build frontend and backend images
        run: docker compose -f docker-compose.yaml build

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-frontend-backend-db-frontend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-frontend-backend-db-backend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
