name: Docker Compose CI

on:
  push:
    branches:
      - devops-setup
  pull_request:
    branches:
      - devops-setup

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Check Compose configuration
        run: docker compose -f docker-compose.yaml config -q

      - name: Build frontend and backend images
        run: docker compose -f docker-compose.yaml build

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-frontend-backend-db-frontend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-frontend-backend-db-backend:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned images to GHCR
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag docker-frontend-backend-db-backend:latest ghcr.io/pandeypushkar809-collab/todo-backend:${IMAGE_TAG}
          docker tag docker-frontend-backend-db-frontend:latest ghcr.io/pandeypushkar809-collab/todo-frontend:${IMAGE_TAG}
          docker push ghcr.io/pandeypushkar809-collab/todo-backend:${IMAGE_TAG}
          docker push ghcr.io/pandeypushkar809-collab/todo-frontend:${IMAGE_TAG}
